<!-- ===================================================================== -->
<!-- 1. HEADER UI SNIPPET: AMBIENT SOUND & MULTI-TRACK PLAYLIST SELECTOR   -->
<!-- Place this inside the right-hand utility bar next to #sound-btn       -->
<!-- ===================================================================== -->
<div class="relative">
  <button onclick="toggleAmbientMenu()" id="ambient-btn" title="Ambient Focus Sound & Playlist"
    class="hig-pill h-8 px-3 text-xs font-medium text-zinc-300 hover:text-white hover:bg-white/5 flex items-center gap-1.5">
    <i data-lucide="cloud-rain" id="ambient-icon" class="w-3.5 h-3.5 text-zinc-400"></i>
    <span id="current-ambient-name" class="hidden sm:inline max-w-[110px] truncate">Off</span>
    <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
  </button>

  <div id="ambient-menu" class="hidden absolute right-0 mt-2 w-64 rounded-xl p-1.5 z-50 bg-[#202227] border border-white/15 shadow-2xl">
    <!-- Built-in Ambient Presets -->
    <button onclick="setAmbientSound('off', 'Off')" class="w-full px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between hover:bg-white/5 text-zinc-200">
      <span>Off</span>
      <i data-lucide="volume-x" class="w-3.5 h-3.5 text-zinc-500"></i>
    </button>
    <button onclick="setAmbientSound('rain', 'Rain')" class="w-full px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between hover:bg-white/5 text-zinc-200">
      <span>Rain</span>
      <i data-lucide="cloud-rain" class="w-3.5 h-3.5 accent-text"></i>
    </button>
    <button onclick="setAmbientSound('cafe', 'Café')" class="w-full px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between hover:bg-white/5 text-zinc-200">
      <span>Café Ambience</span>
      <i data-lucide="coffee" class="w-3.5 h-3.5 accent-text"></i>
    </button>
    <button onclick="setAmbientSound('whitenoise', 'White Noise')" class="w-full px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between hover:bg-white/5 text-zinc-200">
      <span>Soft White Noise</span>
      <i data-lucide="wind" class="w-3.5 h-3.5 accent-text"></i>
    </button>

    <div class="my-1.5 border-t border-white/10"></div>

    <!-- Custom Music Playlist Section (Visible once tracks are added) -->
    <div id="custom-playlist-section" class="hidden flex-col gap-1 mb-1">
      <div class="px-2.5 py-1 flex items-center justify-between">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Your Music (<span id="playlist-count">0</span>)</span>
        <!-- Playback Mode Controls: Loop All (Circle), Repeat One, Shuffle -->
        <div class="flex items-center gap-0.5 bg-black/30 p-0.5 rounded-lg border border-white/10">
          <button type="button" onclick="setPlaylistMode('loop', event)" id="mode-playlist-loop" title="Loop Playlist (Circle)"
            class="p-1 rounded-md text-white bg-white/10 transition-colors">
            <i data-lucide="repeat" class="w-3 h-3"></i>
          </button>
          <button type="button" onclick="setPlaylistMode('one', event)" id="mode-playlist-one" title="Repeat Current Song"
            class="p-1 rounded-md text-zinc-400 hover:text-white transition-colors">
            <i data-lucide="repeat-1" class="w-3 h-3"></i>
          </button>
          <button type="button" onclick="setPlaylistMode('shuffle', event)" id="mode-playlist-shuffle" title="Random Shuffle"
            class="p-1 rounded-md text-zinc-400 hover:text-white transition-colors">
            <i data-lucide="shuffle" class="w-3 h-3"></i>
          </button>
        </div>
      </div>

      <!-- Mini Prev / Next Track Bar -->
      <div class="px-2.5 py-1 flex items-center justify-between gap-2 bg-white/[0.03] rounded-lg border border-white/[0.06]">
        <button type="button" onclick="playPrevCustomTrack(event)" title="Previous Track" class="p-1 text-zinc-400 hover:text-white">
          <i data-lucide="skip-back" class="w-3.5 h-3.5"></i>
        </button>
        <span id="now-playing-custom-label" class="text-[11px] font-medium text-zinc-200 truncate flex-1 text-center">No track selected</span>
        <button type="button" onclick="playNextCustomTrack(event)" title="Next Track" class="p-1 text-zinc-400 hover:text-white">
          <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Scrollable Track List -->
      <div id="custom-playlist-items" class="max-h-36 overflow-y-auto space-y-0.5 pr-0.5 mt-0.5"></div>

      <div class="my-1 border-t border-white/10"></div>
    </div>

    <!-- Upload Multiple MP3s Trigger -->
    <button type="button" onclick="triggerCustomAudioUpload()" class="w-full px-3 py-1.5 rounded-lg text-left text-xs flex items-center justify-between hover:bg-white/5 text-zinc-300">
      <span>Add MP3 tracks...</span>
      <i data-lucide="plus-circle" class="w-3.5 h-3.5 accent-text"></i>
    </button>
    <input id="custom-audio-input" type="file" accept="audio/mp3,audio/mpeg,audio/*" multiple class="hidden" onchange="handleCustomAudioUpload(event)" />
  </div>
</div>


<script>
/***************************************************************************
 * 2. APPLE-INSPIRED WEB AUDIO API SOUND, AMBIENT & PLAYLIST ENGINE
 ***************************************************************************/
let audioCtx = null;
let ambientNodes = null;
let ambientMurmurInterval = null;
let customAudioElement = null;
let customFadeInterval = null;

// Extend state with ambient & multi-track playlist settings
state.ambientType = state.ambientType || 'off';       // 'off' | 'rain' | 'cafe' | 'whitenoise' | 'custom'
state.ambientVolume = 0.16;
state.playlistMode = state.playlistMode || 'loop';    // 'loop' (circle) | 'one' (repeat song) | 'shuffle' (random)
state.customPlaylist = state.customPlaylist || [];    // Array of { id, name, url }
state.currentTrackIndex = state.currentTrackIndex ?? 0;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

/**
 * Synthesizes UI & Timer sound cues:
 * - 'start'    : Subtle, soft rising confirmation sound
 * - 'pause'    : Gentle, short descending sound
 * - 'complete' : Pleasant, elegant notification chime
 * - 'click'    : Very subtle tactile click
 */
function playChime(type = 'click') {
  if (!state.soundEnabled) return;

  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    if (type === 'start') {
      const notes = [
        { freq: 698.46, delay: 0.0, dur: 0.22, peak: 0.045 },
        { freq: 1046.50, delay: 0.065, dur: 0.32, peak: 0.055 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now + n.delay);

        gain.gain.setValueAtTime(0.0001, now + n.delay);
        gain.gain.linearRampToValueAtTime(n.peak, now + n.delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.delay + n.dur);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.delay);
        osc.stop(now + n.delay + n.dur + 0.02);
      });

    } else if (type === 'pause') {
      const notes = [
        { freq: 880.00, delay: 0.0, dur: 0.12, peak: 0.04 },
        { freq: 659.25, delay: 0.05, dur: 0.18, peak: 0.03 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now + n.delay);

        gain.gain.setValueAtTime(0.0001, now + n.delay);
        gain.gain.linearRampToValueAtTime(n.peak, now + n.delay + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.delay + n.dur);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + n.delay);
        osc.stop(now + n.delay + n.dur + 0.02);
      });

    } else if (type === 'complete') {
      const chord = [523.25, 659.25, 783.99, 987.77, 1174.66];
      chord.forEach((freq, idx) => {
        const startTime = now + idx * 0.095;
        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        subOsc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);
        subOsc.frequency.setValueAtTime(freq * 0.5, startTime);

        const peakGain = 0.085 / (1 + idx * 0.22);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 2.3);

        osc.connect(gain);
        subOsc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        subOsc.start(startTime);
        osc.stop(startTime + 2.35);
        subOsc.stop(startTime + 2.35);
      });

    } else if (type === 'click') {
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.018);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, now);

      gain.gain.setValueAtTime(0.028, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.02);
    }
  } catch (e) {}
}

/***************************************************************************
 * MULTI-TRACK MP3 PLAYLIST, SHUFFLE, LOOP ALL & REPEAT-ONE ENGINE
 ***************************************************************************/
function ensureCustomAudioElement() {
  if (!customAudioElement) {
    customAudioElement = new Audio();
    customAudioElement.volume = 0;
    customAudioElement.addEventListener('ended', handleCustomTrackEnded);
  }
  return customAudioElement;
}

function triggerCustomAudioUpload() {
  playChime('click');
  const fileInput = document.getElementById('custom-audio-input');
  if (fileInput) fileInput.click();
}

function handleCustomAudioUpload(event) {
  const files = Array.from(event.target.files || []);
  if (files.length === 0) return;

  const wasEmpty = state.customPlaylist.length === 0;

  files.forEach(file => {
    const cleanName = file.name.replace(/\.[^/.]+$/, '');
    const objectUrl = URL.createObjectURL(file);
    state.customPlaylist.push({
      id: 'trk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      name: cleanName,
      url: objectUrl
    });
  });

  if (wasEmpty) {
    state.currentTrackIndex = 0;
  }

  loadCustomTrack(state.currentTrackIndex, false);
  renderCustomPlaylistUI();

  const currentTrack = state.customPlaylist[state.currentTrackIndex];
  setAmbientSound('custom', currentTrack ? currentTrack.name : 'Custom Music');
  event.target.value = '';
}

function loadCustomTrack(index, autoPlayIfRunning = true) {
  if (state.customPlaylist.length === 0) return;
  const safeIndex = ((index % state.customPlaylist.length) + state.customPlaylist.length) % state.customPlaylist.length;
  state.currentTrackIndex = safeIndex;

  const track = state.customPlaylist[safeIndex];
  const audio = ensureCustomAudioElement();
  if (audio.src !== track.url) {
    audio.src = track.url;
  }
  audio.loop = (state.playlistMode === 'one');

  renderCustomPlaylistUI();
  updateAmbientBadgeLabel();

  if (autoPlayIfRunning && state.isRunning && state.ambientType === 'custom' && state.soundEnabled) {
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }
}

function handleCustomTrackEnded() {
  if (state.customPlaylist.length === 0) return;

  if (state.playlistMode === 'one') {
    const audio = ensureCustomAudioElement();
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }

  let nextIdx = state.currentTrackIndex;
  if (state.playlistMode === 'shuffle') {
    if (state.customPlaylist.length > 1) {
      do {
        nextIdx = Math.floor(Math.random() * state.customPlaylist.length);
      } while (nextIdx === state.currentTrackIndex);
    }
  } else {
    // 'loop' (circle through all tracks in order)
    nextIdx = (state.currentTrackIndex + 1) % state.customPlaylist.length;
  }

  loadCustomTrack(nextIdx, true);
}

function setPlaylistMode(mode, event) {
  if (event) event.stopPropagation();
  playChime('click');
  state.playlistMode = mode; // 'loop' | 'one' | 'shuffle'

  if (customAudioElement) {
    customAudioElement.loop = (mode === 'one');
  }

  ['loop', 'one', 'shuffle'].forEach(m => {
    const btn = document.getElementById(`mode-playlist-${m}`);
    if (btn) {
      btn.className = (m === mode)
        ? 'p-1 rounded-md text-white bg-white/15 transition-colors'
        : 'p-1 rounded-md text-zinc-400 hover:text-white transition-colors';
    }
  });
}

function selectCustomTrack(index, event) {
  if (event) event.stopPropagation();
  playChime('click');
  loadCustomTrack(index, false);
  const track = state.customPlaylist[state.currentTrackIndex];
  setAmbientSound('custom', track ? track.name : 'Custom Music');
}

function playNextCustomTrack(event) {
  if (event) event.stopPropagation();
  playChime('click');
  if (state.customPlaylist.length === 0) return;

  let nextIdx = state.currentTrackIndex;
  if (state.playlistMode === 'shuffle' && state.customPlaylist.length > 1) {
    do {
      nextIdx = Math.floor(Math.random() * state.customPlaylist.length);
    } while (nextIdx === state.currentTrackIndex);
  } else {
    nextIdx = (state.currentTrackIndex + 1) % state.customPlaylist.length;
  }

  loadCustomTrack(nextIdx, true);
  if (state.ambientType !== 'custom') {
    const track = state.customPlaylist[state.currentTrackIndex];
    setAmbientSound('custom', track ? track.name : 'Custom Music');
  }
}

function playPrevCustomTrack(event) {
  if (event) event.stopPropagation();
  playChime('click');
  if (state.customPlaylist.length === 0) return;

  const prevIdx = (state.currentTrackIndex - 1 + state.customPlaylist.length) % state.customPlaylist.length;
  loadCustomTrack(prevIdx, true);
  if (state.ambientType !== 'custom') {
    const track = state.customPlaylist[state.currentTrackIndex];
    setAmbientSound('custom', track ? track.name : 'Custom Music');
  }
}

function removeCustomTrack(id, event) {
  if (event) event.stopPropagation();
  playChime('click');

  const idx = state.customPlaylist.findIndex(t => t.id === id);
  if (idx === -1) return;

  const [removed] = state.customPlaylist.splice(idx, 1);
  if (removed && removed.url) {
    URL.revokeObjectURL(removed.url);
  }

  if (state.customPlaylist.length === 0) {
    state.currentTrackIndex = 0;
    if (customAudioElement) {
      customAudioElement.pause();
      customAudioElement.removeAttribute('src');
    }
    renderCustomPlaylistUI();
    if (state.ambientType === 'custom') {
      setAmbientSound('off', 'Off');
    }
    return;
  }

  if (state.currentTrackIndex >= state.customPlaylist.length) {
    state.currentTrackIndex = 0;
  }

  loadCustomTrack(state.currentTrackIndex, true);
  renderCustomPlaylistUI();
}

function updateAmbientBadgeLabel() {
  if (state.ambientType !== 'custom') return;
  const labelEl = document.getElementById('current-ambient-name');
  const currentTrack = state.customPlaylist[state.currentTrackIndex];
  if (labelEl && currentTrack) {
    labelEl.textContent = currentTrack.name;
  }
}

function renderCustomPlaylistUI() {
  const section = document.getElementById('custom-playlist-section');
  const listEl = document.getElementById('custom-playlist-items');
  const countEl = document.getElementById('playlist-count');
  const nowPlayingEl = document.getElementById('now-playing-custom-label');

  if (!section || !listEl) return;

  if (state.customPlaylist.length === 0) {
    section.classList.add('hidden');
    section.classList.remove('flex');
    listEl.innerHTML = '';
    return;
  }

  section.classList.remove('hidden');
  section.classList.add('flex');
  if (countEl) countEl.textContent = state.customPlaylist.length;

  const activeTrack = state.customPlaylist[state.currentTrackIndex];
  if (nowPlayingEl) {
    nowPlayingEl.textContent = activeTrack ? activeTrack.name : 'No track selected';
  }

  listEl.innerHTML = state.customPlaylist.map((trk, idx) => {
    const isCurrent = (idx === state.currentTrackIndex);
    const isPlayingCustom = (state.ambientType === 'custom' && isCurrent);
    return `
      <div class="group flex items-center justify-between gap-1 px-2.5 py-1.5 rounded-lg text-xs ${isPlayingCustom ? 'bg-white/10 text-white font-medium' : 'text-zinc-300 hover:bg-white/5'}">
        <button type="button" onclick="selectCustomTrack(${idx}, event)" class="flex items-center gap-2 min-w-0 flex-1 text-left">
          <i data-lucide="${isPlayingCustom ? 'volume-2' : 'music'}" class="w-3 h-3 ${isPlayingCustom ? 'accent-text' : 'text-zinc-500'} shrink-0"></i>
          <span class="truncate">${escapeHtml(trk.name)}</span>
        </button>
        <button type="button" onclick="removeCustomTrack('${trk.id}', event)" title="Remove track"
          class="opacity-60 hover:opacity-100 text-zinc-500 hover:text-rose-400 p-0.5 rounded">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>
    `;
  }).join('');

  lucide.createIcons();
}

/***************************************************************************
 * AMBIENT FOCUS SOUNDSCAPES (Rain, Café, Soft White Noise, Custom Playlist)
 ***************************************************************************/
function createNoiseBuffer(ctx, durationSec = 4, pink = false) {
  const sampleRate = ctx.sampleRate;
  const bufferSize = sampleRate * durationSec;
  const buffer = ctx.createBuffer(1, bufferSize, sampleRate);
  const output = buffer.getChannelData(0);

  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    if (pink) {
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
      b6 = white * 0.115926;
    } else {
      output[i] = white * 0.25;
    }
  }
  return buffer;
}

function startAmbientSound() {
  stopAmbientSound();
  if (!state.soundEnabled || state.ambientType === 'off' || !state.isRunning) return;

  // Custom Playlist playback with smooth fade-in
  if (state.ambientType === 'custom') {
    if (state.customPlaylist.length === 0) return;
    const audio = ensureCustomAudioElement();
    const currentTrack = state.customPlaylist[state.currentTrackIndex] || state.customPlaylist[0];
    if (!audio.src || audio.src !== currentTrack.url) {
      audio.src = currentTrack.url;
    }
    audio.loop = (state.playlistMode === 'one');
    audio.volume = 0;
    audio.play().catch(() => {});

    const targetVol = 0.35;
    customFadeInterval = setInterval(() => {
      if (!customAudioElement || !state.isRunning) {
        clearInterval(customFadeInterval);
        return;
      }
      if (customAudioElement.volume < targetVol - 0.02) {
        customAudioElement.volume = Math.min(targetVol, customAudioElement.volume + 0.025);
      } else {
        customAudioElement.volume = targetVol;
        clearInterval(customFadeInterval);
      }
    }, 50);
    return;
  }

  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.linearRampToValueAtTime(state.ambientVolume, now + 0.8);
    masterGain.connect(ctx.destination);

    if (state.ambientType === 'whitenoise') {
      const source = ctx.createBufferSource();
      source.buffer = createNoiseBuffer(ctx, 5, true);
      source.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(950, now);

      source.connect(filter);
      filter.connect(masterGain);
      source.start(now);

      ambientNodes = { source, masterGain };

    } else if (state.ambientType === 'rain') {
      const baseSource = ctx.createBufferSource();
      baseSource.buffer = createNoiseBuffer(ctx, 5, true);
      baseSource.loop = true;

      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.setValueAtTime(1100, now);
      bandpass.Q.setValueAtTime(0.65, now);

      const lowShelf = ctx.createBiquadFilter();
      lowShelf.type = 'lowshelf';
      lowShelf.frequency.setValueAtTime(320, now);
      lowShelf.gain.setValueAtTime(4, now);

      baseSource.connect(bandpass);
      bandpass.connect(lowShelf);
      lowShelf.connect(masterGain);
      baseSource.start(now);

      ambientNodes = { source: baseSource, masterGain };

    } else if (state.ambientType === 'cafe') {
      const roomSource = ctx.createBufferSource();
      roomSource.buffer = createNoiseBuffer(ctx, 6, true);
      roomSource.loop = true;

      const roomFilter = ctx.createBiquadFilter();
      roomFilter.type = 'bandpass';
      roomFilter.frequency.setValueAtTime(420, now);
      roomFilter.Q.setValueAtTime(0.9, now);

      roomSource.connect(roomFilter);
      roomFilter.connect(masterGain);
      roomSource.start(now);

      ambientMurmurInterval = setInterval(() => {
        if (!state.isRunning || state.ambientType !== 'cafe' || !state.soundEnabled) return;
        const t = ctx.currentTime;
        const swellSource = ctx.createBufferSource();
        swellSource.buffer = createNoiseBuffer(ctx, 1.2, true);

        const formant = ctx.createBiquadFilter();
        formant.type = 'bandpass';
        formant.frequency.setValueAtTime(300 + Math.random() * 550, t);
        formant.Q.setValueAtTime(2.5, t);

        const swellGain = ctx.createGain();
        swellGain.gain.setValueAtTime(0.0001, t);
        swellGain.gain.linearRampToValueAtTime(0.045, t + 0.35);
        swellGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);

        swellSource.connect(formant);
        formant.connect(swellGain);
        swellGain.connect(masterGain);

        swellSource.start(t);
        swellSource.stop(t + 1.15);
      }, 950);

      ambientNodes = { source: roomSource, masterGain };
    }
  } catch (e) {}
}

function stopAmbientSound() {
  if (customFadeInterval) {
    clearInterval(customFadeInterval);
    customFadeInterval = null;
  }
  if (customAudioElement && !customAudioElement.paused) {
    const el = customAudioElement;
    customFadeInterval = setInterval(() => {
      if (el.volume > 0.04) {
        el.volume = Math.max(0, el.volume - 0.04);
      } else {
        el.volume = 0;
        el.pause();
        clearInterval(customFadeInterval);
      }
    }, 35);
  }

  if (ambientMurmurInterval) {
    clearInterval(ambientMurmurInterval);
    ambientMurmurInterval = null;
  }
  if (ambientNodes && audioCtx) {
    try {
      const now = audioCtx.currentTime;
      ambientNodes.masterGain.gain.cancelScheduledValues(now);
      ambientNodes.masterGain.gain.setValueAtTime(ambientNodes.masterGain.gain.value, now);
      ambientNodes.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
      const oldSource = ambientNodes.source;
      setTimeout(() => {
        try { oldSource.stop(); oldSource.disconnect(); } catch (e) {}
      }, 280);
    } catch (e) {}
    ambientNodes = null;
  }
}

function toggleAmbientMenu() {
  const menu = document.getElementById('ambient-menu');
  if (menu) menu.classList.toggle('hidden');
}

function setAmbientSound(type, labelName) {
  playChime('click');
  state.ambientType = type;
  const labelEl = document.getElementById('current-ambient-name');
  const iconEl = document.getElementById('ambient-icon');
  const menuEl = document.getElementById('ambient-menu');

  if (labelEl) labelEl.textContent = labelName;
  if (menuEl && type !== 'custom') menuEl.classList.add('hidden');

  if (iconEl) {
    const iconMap = {
      off: 'cloud-rain',
      rain: 'cloud-rain',
      cafe: 'coffee',
      whitenoise: 'wind',
      custom: 'music'
    };
    iconEl.setAttribute('data-lucide', iconMap[type] || 'cloud-rain');
    iconEl.className = type === 'off' ? 'w-3.5 h-3.5 text-zinc-400' : 'w-3.5 h-3.5 accent-text';
    lucide.createIcons();
  }

  renderCustomPlaylistUI();

  if (state.isRunning && type !== 'off') {
    startAmbientSound();
  } else {
    stopAmbientSound();
  }
  saveToStorage();
}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  updateSoundIcon();
  if (state.soundEnabled) {
    playChime('click');
    if (state.isRunning) startAmbientSound();
  } else {
    stopAmbientSound();
  }
  saveToStorage();
}

/***************************************************************************
 * 3. TIMER ENGINE HOOKS (Start / Pause / Clickoutside)
 ***************************************************************************/
function toggleStartPause() {
  if (state.isRunning) {
    playChime('pause');
    pauseEngine();
  } else {
    playChime('start');
    startEngine();
    startAmbientSound();
  }
}

function pauseEngine() {
  state.isRunning = false;
  if (intervalId) {
    clearInterval(intervalId);
    intervalId = null;
  }
  stopAmbientSound();
  updateControlButtonsUI();
  updateDisplay();
}

// Close ambient dropdown when clicking outside
window.addEventListener('click', (e) => {
  const ambientMenu = document.getElementById('ambient-menu');
  const ambientBtn = document.getElementById('ambient-btn');
  if (ambientMenu && ambientBtn && !ambientMenu.contains(e.target) && !ambientBtn.contains(e.target)) {
    ambientMenu.classList.add('hidden');
  }
});
</script>
